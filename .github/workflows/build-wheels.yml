name: Build and test wheels

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_x86_64
            zip: manylinux_2_28_x86_64-binaries.zip
            library_zip_name: libausaxs.so
            library: libausaxs.so

          - os: ubuntu-24.04-arm
            platform: linux_aarch64
            zip: manylinux_2_28_aarch64-binaries.zip
            library_zip_name: libausaxs.so
            library: libausaxs.so

          - os: macos-latest  
            platform: macosx_11_0_universal2
            zip: macos-universal-binaries.zip
            library_zip_name: libausaxs.dylib
            library: libausaxs.dylib

          - os: windows-latest
            platform: win_amd64
            zip: windows-x64-binaries.zip
            library_zip_name: libausaxs.dll
            library: libausaxs.dll

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Download and extract platform-specific library
        uses: robinraju/release-downloader@v1
        with:
          repository: AUSAXS/AUSAXS
          fileName: ${{ matrix.zip }}
          token: ${{ secrets.GITHUB_TOKEN }}
          latest: true
          extract: true

      - name: Rename and move library to resource folder
        shell: bash
        run: | 
          mkdir -p pyausaxs/resources
          LIBRARY_PATH=$(find . -name "${{ matrix.library_zip_name }}" -type f | head -n 1)

          if [ -z "$LIBRARY_PATH" ]; then
            echo "Error: Could not find ${{ matrix.library_zip_name }} in extracted files"
            echo "Available library files:"
            find . -name "*.so" -o -name "*.dylib" -o -name "*.dll" | head -10
            echo "Directory structure:"
            find . -type d | head -10
            exit 1
          fi

          cp "$LIBRARY_PATH" "pyausaxs/resources/${{ matrix.library }}"
          echo "Library copied: ${{ matrix.library_zip_name }}"
          ls -la pyausaxs/resources/

      - name: Verify library exists
        shell: bash
        run: |
          if [ ! -f "pyausaxs/resources/${{ matrix.library }}" ]; then
            echo "Error: Library not found at pyausaxs/resources/${{ matrix.library }}"
            ls -la pyausaxs/resources/
            exit 1
          fi

      - name: Build platform-specific wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build packaging
          python -m build --wheel

      - name: Tag the platform wheel
        shell: bash
        run: |
          python -m pip install --upgrade wheel
          python -m wheel tags --remove --platform-tag ${{ matrix.platform }} dist/*.whl
          case "$RUNNER_OS" in
            Linux)
              # lowers linux_* to the oldest manylinux tag the library's glibc and libstdc++ symbols allow;
              # libcurl is outside the manylinux policy but on every desktop system, so it is used from the system instead of vendored
              python -m pip install auditwheel patchelf
              auditwheel repair --exclude 'libcurl.so.4' -w wheelhouse dist/*.whl ;;
            macOS)
              # fails unless the library has both architectures and runs on the macOS version in the tag;
              # vendors any library that is not part of the system
              python -m pip install delocate
              MACOSX_DEPLOYMENT_TARGET=11.0 delocate-wheel --require-archs universal2 -w wheelhouse dist/*.whl ;;
            Windows)
              # the library links the C runtime and libcurl statically, so there is nothing to vendor
              mkdir wheelhouse && mv dist/*.whl wheelhouse/ ;;
          esac
          rm -f dist/*.whl
          mv wheelhouse/*.whl dist/
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl

      - name: Test wheel installation
        shell: bash
        run: |
          pip install twine pytest scipy numpy matplotlib
          twine check dist/*.whl
          rm -rf pyausaxs
          python -m pip install dist/*.whl
          pytest -q