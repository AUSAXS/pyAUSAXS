name: Debug macOS GUI with tmate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download macOS backend
        uses: robinraju/release-downloader@v1
        with:
          repository: AUSAXS/AUSAXS
          fileName: macos-universal-binaries.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          latest: true
          extract: true

      - name: Open SSH debug session
        uses: mxschmitt/action-tmate@v3